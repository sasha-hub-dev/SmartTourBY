services:
  postgres:
    image: postgres:15
    container_name: smarttour-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smarttour_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smarttour-cache
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: smarttour-ui-db
    ports:
      - "8080:8080"
    depends_on:
      - postgres