server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smarttour_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Настройки безопасности из ТЗ
