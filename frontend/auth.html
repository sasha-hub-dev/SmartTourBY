<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTourBY | Авторизация</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="background-decor">
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="auth-container">
    <div class="auth-card" id="auth-card">
        <div class="auth-header">
            <h2 id="auth-title">С возвращением</h2>
            <p id="auth-subtitle">Войдите в систему для доступа к турам</p>
        </div>

        <form id="auth-form" class="auth-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
                <div class="input-line"></div>
            </div>

            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <div class="input-line"></div>
            </div>

            <button type="submit" id="submit-btn" class="btn-glow">
                <span>Войти в систему</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Еще нет аккаунта? <a href="#" id="toggle-auth">Создать профиль</a></p>
        </div>
    </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
