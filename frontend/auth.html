<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дороги Памяти | Авторизация</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Добро пожаловать</h2>
            <p>Войдите, чтобы планировать маршруты</p>
        </div>

        <form id="login-form" class="auth-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary full-width">Войти в систему</button>
        </form>

        <div class="auth-footer">
            <span>Нет аккаунта?</span> <a href="#" id="toggle-auth">Создать профиль</a>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
